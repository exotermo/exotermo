<svg width="100%" viewBox="0 0 1100 460" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
.sec-label { font-family: monospace; font-size: 11px; font-weight: 500; fill: #888780; text-anchor: middle; }
.badge-text { font-family: monospace; font-size: 11px; font-weight: 500; text-anchor: middle; }
.line { stroke: #B4B2A9; stroke-width: 0.5; }
</style>
</defs>

<!-- Coluna 1: Linguagens -->
<g transform="translate(30, 0)">
