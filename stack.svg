<svg width="100%" viewBox="0 0 1100 460" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
.sec-label { font-family: monospace; font-size: 11px; font-weight: 500; fill: #888780; text-anchor: middle; }
.badge-text { font-family: monospace; font-size: 11px; font-weight: 500; text-anchor: middle; }
.line { stroke: #B4B2A9; stroke-width: 0.5; }
</style>
</defs>

<!-- Coluna 1: Linguagens -->
<g transform="translate(30, 0)">
  <text class="sec-label" x="60" y="24">Linguagens</text>
  <line x1="0" y1="30" x2="120" y2="30" class="line"/>
  <rect x="0" y="40" width="120" height="28" rx="5" fill="#0095D5"/>
  <text class="badge-text" x="60" y="58" fill="#fff">Kotlin</text>
  <rect x="0" y="76" width="120" height="28" rx="5" fill="#ED8B00"/>
  <text class="badge-text" x="60" y="94" fill="#fff">Java 17</text>
  <rect x="0" y="112" width="120" height="28" rx="5" fill="#3776AB"/>
  <text class="badge-text" x="60" y="130" fill="#fff">Python</text>
</g>

<!-- Coluna 2: Android -->
<g transform="translate(170, 0)">
  <text class="sec-label" x="60" y="24">Android</text>
  <line x1="0" y1="30" x2="120" y2="30" class="line"/>
  <rect x="0" y="40" width="120" height="28" rx="5" fill="#3DDC84"/>
  <text class="badge-text" x="60" y="58" fill="#0a3d1f">Android</text>
  <rect x="0" y="76" width="120" height="28" rx="5" fill="#4285F4"/>
  <text class="badge-text" x="60" y="94" fill="#fff">Jetpack Compose</text>
  <rect x="0" y="112" width="120" height="28" rx="5" fill="#FFCA28"/>
  <text class="badge-text" x="60" y="130" fill="#1a0f00">Firebase</text>
</g>

<!-- Coluna 3: Frontend -->
<g transform="translate(310, 0)">
  <text class="sec-label" x="60" y="24">Frontend</text>
  <line x1="0" y1="30" x2="120" y2="30" class="line"/>
  <rect x="0" y="40" width="120" height="28" rx="5" fill="#E34F26"/>
  <text class="badge-text" x="60" y="58" fill="#fff">HTML5</text>
  <rect x="0" y="76" width="120" height="28" rx="5" fill="#1572B6"/>
  <text class="badge-text" x="60" y="94" fill="#fff">CSS3</text>
  <rect x="0" y="112" width="120" height="28" rx="5" fill="#F7DF1E"/>
  <text class="badge-text" x="60" y="130" fill="#1a1500">JavaScript</text>
  <rect x="0" y="148" width="120" height="28" rx="5" fill="#20232A"/>
  <text class="badge-text" x="60" y="166" fill="#61DAFB">React</text>
  <rect x="0" y="184" width="120" height="28" rx="5" fill="#777BB4"/>
  <text class="badge-text" x="60" y="202" fill="#fff">PHP</text>
</g>

<!-- Coluna 4: Banco de dados & scripting -->
<g transform="translate(450, 0)">
  <text class="sec-label" x="75" y="18">Banco de dados</text>
  <text class="sec-label" x="75" y="30">&amp; scripting</text>
  <line x1="0" y1="36" x2="150" y2="36" class="line"/>
  <rect x="15" y="46" width="120" height="28" rx="5" fill="#4169E1"/>
  <text class="badge-text" x="75" y="64" fill="#fff">PostgreSQL</text>
  <rect x="15" y="82" width="120" height="28" rx="5" fill="#1a1a1a"/>
  <text class="badge-text" x="75" y="100" fill="#fff">Shell Script</text>
</g>



</svg>
